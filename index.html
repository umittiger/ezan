<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <title>Ezan & Namaz Saati</title>
</head>
<body>
    <p id="status">Ezan ve namaz saati yükleniyor…</p>
    <script>
        // Load the last complete version of the app from before the accidental
        // replacement of index.html. The commit-pinned URL avoids tracking a
        // moving branch and keeps this GitHub Pages entry point stable.
        const sourceUrl = 'https://raw.githubusercontent.com/umittiger/ezan/6dd75acba6a98a2d8bc53c0813310501db7e8418/ezan.html';

        fetch(sourceUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Uygulama dosyası yüklenemedi (${response.status}).`);
                }
                return response.text();
            })
            .then(html => {
                // Keep the requested location label consistent throughout the page.
                html = html.replace(/Hıranet/g, 'Diyanet');
                document.open();
                document.write(html);
                document.close();
            })
            .catch(error => {
                document.getElementById('status').textContent = 'Uygulama yüklenemedi. Sayfayı yenileyin veya internet bağlantınızı kontrol edin.';
                console.error('Ezan uygulaması yüklenemedi:', error);
            });
    </script>
</body>
</html>
