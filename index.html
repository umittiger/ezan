<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ezan & Namaz Saati</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            height: 100vh; width: 100vw; overflow: hidden; color: #f8fafc; display: flex; flex-direction: column;
            justify-content: space-between; padding: 10px 18px; user-select: none; -webkit-user-select: none; position: relative; background-color: #0b1120;
        }
        .bg-layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-size: cover; background-position: center center; filter: brightness(0.48) contrast(1.05); z-index: 1; transition: opacity 1.8s ease-in-out; will-change: opacity; }
        #bg-1 { opacity: 1; z-index: 2; }
        #bg-2 { opacity: 0; z-index: 1; }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; z-index: 50; position: relative; pointer-events: auto; }
        .location-badge { display: inline-block; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #38bdf8; font-size: 0.82rem; font-weight: 600; padding: 4px 10px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.3); margin-bottom: 2px; }
        .date-display { font-size: 0.95rem; color: #f1f5f9; font-weight: 500; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
        .countdown-box { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 5px 12px; border-radius: 12px; text-align: right; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
        .countdown-label { font-size: 0.68rem; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.5px; }
        .countdown-target { font-size: 0.90rem; font-weight: bold; color: #38bdf8; margin: 1px 0; display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
        .countdown-timer { font-size: 1.20rem; font-weight: 700; color: #f59e0b; font-variant-numeric: tabular-nums; line-height: 1.1; }
        .main-layout { flex: 1; display: flex; justify-content: space-between; align-items: stretch; gap: 12px; margin: 6px 0; z-index: 20; position: relative; }
        .family-tracker-panel { width: 86px; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; padding: 6px 4px; display: flex; flex-direction: column; justify-content: space-around; gap: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 50; position: relative; pointer-events: auto; }
        .family-card { border-radius: 10px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; user-select: none; gap: 1px; flex: 1; }
        .family-card.unprayed { background: rgba(239, 68, 68, 0.22); border: 1.5px solid #ef4444; box-shadow: 0 2px 6px rgba(239, 68, 68, 0.25); }
        .family-card.prayed { background: rgba(16, 185, 129, 0.30); border: 1.5px solid #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        .person-name-label { font-size: 0.65rem; font-weight: 700; color: #cbd5e1; line-height: 1.1; }
        .person-sub-badge { font-size: 0.60rem; font-weight: 700; padding: 0 4px; border-radius: 4px; line-height: 1.2; }
        .person-counter { font-size: 0.70rem; color: #f59e0b; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
        .center-display { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; padding-top: 10px; z-index: 20; }
        .big-digital-time { font-size: min(11vw, 5rem); font-weight: 800; letter-spacing: 2px; color: rgba(255, 255, 255, 0.55); line-height: 1; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; text-shadow: 0 4px 14px rgba(0,0,0,0.8); }
        .sec-digits { font-size: 0.55em; color: rgba(255, 255, 255, 0.35); font-weight: 700; margin-left: 4px; }
        .next-prayer-hint { margin-top: 6px; font-size: 0.95rem; color: rgba(203, 213, 225, 0.85); font-weight: 500; text-shadow: 0 2px 8px rgba(0,0,0,0.7); }
        .prayer-list-panel { width: 132px; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; padding: 6px; display: flex; flex-direction: column; justify-content: space-around; gap: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 50; position: relative; pointer-events: auto; }
        .prayer-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 8px; background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.08); font-size: 0.82rem; color: #cbd5e1; transition: all 0.2s; }
        .prayer-click-adhan { display: flex; align-items: center; gap: 4px; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
        .prayer-click-tesbihat { font-size: 0.85rem; font-weight: 700; color: #38bdf8; font-variant-numeric: tabular-nums; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
        .no-click-imsak { cursor: default !important; opacity: 0.75; }
        .bottom-bar { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; z-index: 50; position: relative; pointer-events: auto; }
        .action-btn { padding: 6px 12px; font-size: 0.80rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: transform 0.15s; }
        .action-btn:hover { transform: translateY(-1px); }
        .btn-green { background-color: #10b981; color: #ffffff; }
        .btn-blue { background-color: #0284c7; color: #ffffff; }
        .btn-purple { background-color: #8b5cf6; color: #ffffff; }
        .btn-slate { background-color: #475569; color: #ffffff; }
        .btn-stop { background: #ef4444; color: white; padding: 6px 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div>
            <div class="location-badge" id="location-badge">📍 89150 Laichingen (Diyanet)</div>
            <div class="date-display" id="current-date">Yükleniyor...</div>
        </div>
        <div class="countdown-box">
            <div class="countdown-label">Sonraki Vakit</div>
            <div class="countdown-target" id="next-prayer-name">--</div>
            <div class="countdown-timer" id="countdown-text">--:--:--</div>
        </div>
    </div>

    <div class="main-layout">
        <div class="family-tracker-panel">
            <div class="family-card unprayed" id="card-Dede" onclick="togglePrayer('Dede')" title="Dede">
                <div class="person-icon">👴</div>
                <span class="person-name-label">Dede</span>
                <span class="person-sub-badge" id="status-Dede">Kılmadı</span>
                <span class="person-counter" id="count-Dede">0</span>
            </div>
            <div class="family-card unprayed" id="card-Nine" onclick="togglePrayer('Nine')" title="Nine">
                <div class="person-icon">👵</div>
                <span class="person-name-label">Nine</span>
                <span class="person-sub-badge" id="status-Nine">Kılmadı</span>
                <span class="person-counter" id="count-Nine">0</span>
            </div>
        </div>

        <div class="center-display">
            <div class="big-digital-time">
                <span id="hm-digits">--:--</span><span class="sec-digits" id="sec-digits">:--</span>
            </div>
            <div class="next-prayer-hint" id="center-hint">Vakitler yükleniyor...</div>
        </div>

        <div class="prayer-list-panel">
            <div class="prayer-row" id="row-Fajr">
                <div class="prayer-click-adhan no-click-imsak" title="İmsak Vakti">
                    <span>🌙</span> <span>İmsak</span>
                </div>
                <div class="prayer-click-tesbihat no-click-imsak" id="time-Fajr" title="İmsak Vakti">--:--</div>
            </div>
            <div class="prayer-row" id="row-Sunrise">
                <div class="prayer-click-adhan" onclick="playPrayerAdhan('Sunrise')" title="Sabah Ezanını Dinle">
                    <span>☀️</span> <span>Güneş</span>
                </div>
                <div class="prayer-click-tesbihat" onclick="playPrayerTesbihat('Sunrise')" id="time-Sunrise" title="Sabah Tesbihatını Dinle">--:--</div>
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        <div style="display:flex; gap:6px;">
            <button class="action-btn btn-purple" onclick="openReportModal()">📊 Rapor</button>
            <button class="action-btn btn-slate" onclick="openBgSettingsModal()">🖼️ Resimler</button>
            <button class="action-btn btn-blue" onclick="openAdhanSelectModal()">🎧 Ezanlar</button>
            <button class="action-btn btn-green" id="audio-init-btn" onclick="initAudio()">Hoparlörü Aç</button>
        </div>
    </div>

    <script>
        let LAT = 48.4897;
        let LNG = 9.6863;
        const METHOD = 13; // Diyanet hesaplama metodu
    </script>
</body>
</html>
